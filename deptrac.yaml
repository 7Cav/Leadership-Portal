# Deptrac — machine-enforced layer boundaries for the 7Cav Leadership Portal.
#
# This file IS the architecture's enforcement mechanism (spine AD-1). A slimmed,
# Laravel-idiomatic model: controllers read straight from Repositories and stage
# writes through Commands; only Repositories touch the DB (AD-2) and only
# Integration reaches the outside world (AD-3). No CQRS read-service / service-facade
# ceremony — those were dropped in favour of the conventional Laravel shape.
#
# Run it:   composer deptrac            (analyse — fails on any violation)
#           composer deptrac:unassigned (list app/ classes that match no layer)
#
# The graph (arrows = "may depend on"):
#   Controller     → CommandHandler, Repository, Model, Authorization, Job, Support\Time, Kpi, Milpac, Rollcall  # writes via Commands; reads direct
#   CommandHandler → Repository, Model, Integration, Support\Audit, Authorization, Support\Time, Kpi  # write-side business logic
#   Kpi            → Repository, Model, Support\Time       # the one shared KPI service (AD-21)
#   Milpac         → Repository, Model                     # what the Epic 6 pages show: the milpac and the readiness matrix; shared by the milpac panels, so it is a layer of its own
#   Controller     → CommandHandler, Repository, Model, Authorization, Job, Support\Time, Kpi  # writes via Commands; reads direct
#   CommandHandler → Repository, Model, Integration, Support\Audit, Authorization, Support\Time, Kpi, Loa  # write-side business logic
#   Kpi            → Repository, Model, Support\Time, Loa  # the one shared KPI service (AD-21)
#   Loa            → Repository, Model, Support\Time       # LOA source/staleness reader and week coverage (Epic 4)
#   Rollcall       → Repository, Model                     # the template a unit resolves to (Epic 3)
#   Job            → Sync, CommandHandler                  # queued jobs invoke a Sync handler (Story 2.4) or a capture Command (Story 7.5)
#   Sync           → Repository, Model, Integration        # one-writer cache sync handlers (AD-4)
#   Authorization  → Repository, Model                     # ScopeResolver, the single scope gate (AD-8)
#   Support\Audit  → Repository                             # audited-action envelope (AD-16)
#   Support\Time   → (nothing)                              # WeekOf, the one week_start mapper (AD-11)
#   Middleware     → Authorization                         # shares + guards the view-as preview (Story 1.13)
#   Repository     → Model, DB, Support\Time               # sole DB access (AD-2)
#   Model          → DB
#   Integration    → External                              # sole path out — Saloon lives here (AD-3)
# Everything else is forbidden: Controller → Integration (external calls stay out of
# controllers), Controller → DB, and any reverse edge all fail the build.

deptrac:
  paths:
    - ./app

  layers:
    # ── Business layers. Each maps 1:1 to a directory in app/. ──
    - name: Controller
      collectors:
        - type: directory
          value: app/Http/Controllers/.*
    - name: CommandHandler
      collectors:
        - type: directory
          value: app/Commands/.*
    - name: Repository
      collectors:
        - type: directory
          value: app/Repositories/.*
    - name: Model
      collectors:
        - type: directory
          value: app/Models/.*
    - name: Integration
      collectors:
        - type: directory
          value: app/Integration/.*
    - name: Support\Audit
      collectors:
        - type: directory
          value: app/Support/Audit/.*
    - name: Support\Time
      collectors:
        - type: directory
          value: app/Support/Time/.*
    - name: Authorization
      collectors:
        - type: directory
          value: app/Authorization/.*
    - name: Sync
      collectors:
        - type: directory
          value: app/Sync/.*
    - name: Kpi
      collectors:
        - type: directory
          value: app/Kpi/.*
    - name: Milpac
      collectors:
        - type: directory
          value: app/Milpac/.*
    - name: Loa
      collectors:
        - type: directory
          value: app/Loa/.*
    - name: Rollcall
      collectors:
        - type: directory
          value: app/Rollcall/.*
    # Queued jobs (Story 2.4): the scheduler and a manual-trigger controller both dispatch a
    # Job, which does nothing but invoke a Sync handler — the async wrapper AD-23 requires
    # around a slow external sync, kept out of the request path.
    - name: Job
      collectors:
        - type: directory
          value: app/Jobs/.*

    # ── Boundary layers — matched by fully-qualified class name, not by directory.
    #    They live in vendor/, so they are only ever dependency *targets*. Defining
    #    them is what lets Deptrac enforce AD-2 (DB reachable only from Repository)
    #    and AD-3 (the external world — Saloon/HTTP — reachable only from Integration). ──
    - name: DB
      collectors:
        - type: classNameRegex
          value: '#^Illuminate\\Database\\#'
        - type: classNameRegex
          value: '#^Illuminate\\Support\\Facades\\DB$#'
    - name: External
      collectors:
        - type: classNameRegex
          value: '#^Saloon\\#'
        - type: classNameRegex
          value: '#^GuzzleHttp\\#'
        - type: classNameRegex
          value: '#^Illuminate\\Http\\Client\\#'
        - type: classNameRegex
          value: '#^Illuminate\\Support\\Facades\\Http$#'

    # ── Framework glue — bootstrap code that sits outside the business graph but must
    #    still be classified so no app/ class is left unassigned (AD-1's "no untracked
    #    code slips the graph"). ──
    - name: Provider
      collectors:
        - type: directory
          value: app/Providers/.*
    - name: Middleware
      collectors:
        - type: directory
          value: app/Http/Middleware/.*

  ruleset:
    # The graph, encoded exactly.
    Controller:
      - CommandHandler
      - Repository
      - Model
      - Authorization
      - Job
      - Support\Time
      # Dashboard and report pages read the six KPIs from the shared service (AD-21, Story 5.1).
      - Kpi
      # The trooper detail page reads its props from the Milpac layer (Epic 6).
      - Milpac
      # The rollcall page resolves its section's active template through the Rollcall layer (Story 3.11).
      - Rollcall
    CommandHandler:
      - Repository
      - Model
      - Integration
      - Support\Audit
      - Authorization
      - Support\Time
      # Sending a weekly report freezes the KPI snapshot computed by the shared service (AD-21).
      - Kpi
      # A practice mark is refused for a trooper whose leave covers the week: that status is derived from the
      # one LOA coverage definition, never hand-entered (Story 3.4).
      - Loa
      # A template is stored only if it is well formed, checked by the Rollcall layer's grammar, so a typo is
      # refused at save and never reaches a section's rollcall (Story 3.11).
      - Rollcall
    # The one shared KPI service (AD-21, Story 5.1): read-only domain logic over facts read
    # through Repositories — the six definitions live here so no Controller, Command or
    # Repository re-derives one. Never touches the DB itself (AD-2).
    Kpi:
      - Repository
      - Model
      - Support\Time
      # LOA coverage is read from its one definition, never re-derived (AD-21, Story 4.8).
      - Loa
    # What the Epic 6 pages show, read through Repositories and shaped as page props: the trooper detail page (the
    # milpac: ID block, courses, awards, service record, quick actions) and the training-readiness matrix of a unit.
    # Read-only; who may look is the Controller's ScopeResolver gate (AD-8), not decided here.
    Milpac:
      - Repository
      - Model
    # LOA reads over the `sync_runs` cache (Epic 4): the source/last-sync every LOA value renders with
    # (4.3, AD-20) and whether a trooper is covered in a Cav week (4.4, AD-21). Read-only; the LOA sync
    # stays the one writer. Support\Time because coverage is judged in whole Cav weeks (`WeekOf`, AD-11).
    # An edge from Controller is added by the story that first renders it.
    Loa:
      - Repository
      - Model
      - Support\Time
    # What the rollcall screen shows and renders from (Epic 3): the template a unit resolves to, and later the
    # roster pre-filled for a week and the BBCode. Read-only. Controller reaches it from the rollcall page (Story 3.11).
    Rollcall:
      - Repository
      - Model
    # One-writer cache sync handler (AD-4, AD-22): reads the source of truth through
    # Integration and persists only through its Repository — the same write-side shape
    # as CommandHandler, minus Support\Audit (sync runs record to sync_runs instead, AD-16).
    Sync:
      - Repository
      - Model
      - Integration
    # A queued job is a thin wrapper — its whole job is calling into its Sync handler
    # off the request path (AD-23). No DB/external access of its own.
    Job:
      - Sync
      # The capture run (7.5) is a Command, queued per AD-23: the job only invokes its handler.
      - CommandHandler
    # Reaches AuditLogRepository to write the audit_log row — the one place outside
    # Repositories/ that needs a DB-writing path, so it goes through the Repository layer
    # rather than touching DB itself (AD-2 unchanged).
    Support\Audit:
      - Repository
    # ScopeResolver reads the org tree and grants through Repositories/ only (AD-2, AD-8);
    # it never touches the DB or an external system directly.
    Authorization:
      - Repository
      - Model
    Repository:
      - Model
      - DB
      - Support\Time
    # The canonical Cav week (AD-11): a pure function over Carbon with no app/ dependency.
    # Reachable from Controller, CommandHandler, Repository and Kpi; add an edge here if another
    # layer needs to bucket a time into a week.
    Support\Time: ~
    Model:
      - DB
    Integration:
      - External

    # Terminal layers — no outgoing edge.
    DB: ~
    External: ~

    # Composition root: a service provider wires DI, so it legitimately references the
    # layers it binds. Bootstrap, not business logic.
    Provider:
      - Controller
      - CommandHandler
      - Repository
      - Model
      - Integration
      - Authorization
      - DB
      # Binds the weekly report's ReportKpiSource seam to its echelon implementation (5.6).
      - Kpi
    # Request glue (Inertia shared props, request guards). Reads the active view-as preview
    # from the ScopeResolver (Story 1.13) to share it with every page and to refuse writes while
    # it is active (AD-9) — the scope decision itself stays in Authorization.
    Middleware:
      - Authorization
