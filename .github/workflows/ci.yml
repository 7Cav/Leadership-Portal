name: CI

# The quality gate (Story 1.3, NFR9). Every push to and PR against the integration
# branch runs all five gates — Pint, Deptrac, Pest, Vitest, Playwright. They run as
# separate jobs, so the overall pipeline status is failure if ANY single gate fails
# (AND-combined, not advisory). External API seams are never called from CI.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── PHP gates: style (Pint), architecture (Deptrac), back-end tests (Pest) ──
  backend:
    name: Backend (Pint · Deptrac · Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Deptrac (layer boundaries)
        run: vendor/bin/deptrac analyse --no-progress --no-cache

      - name: Deptrac (no unassigned classes)
        run: |
          vendor/bin/deptrac debug:unassigned --no-cache | tee deptrac-unassigned.txt
          grep -q "There are no unassigned tokens." deptrac-unassigned.txt

      - name: Pest (PHP tests)
        run: php artisan test

  # ── Front-end unit gate: Vitest (Vue components) ──
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest (Vue unit tests)
        run: npm run test:unit

  # ── Browser E2E gate: Playwright drives the real app ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The sample page touches no DB, so the app serves on SQLite with array session/
    # cache drivers — no MySQL service is needed yet. Add one here (and switch these
    # back to database drivers) once an E2E flow exercises persisted data.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build front-end assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (browser E2E)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
