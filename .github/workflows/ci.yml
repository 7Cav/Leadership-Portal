name: CI

# The quality gate (Story 1.3, NFR9). Every push to and PR against the integration
# branch runs all six gates — Pint, Deptrac, Pest, Vitest, Playwright, npm audit. They
# run as separate jobs, so the overall pipeline status is failure if ANY single gate
# fails (AND-combined, not advisory). External API seams are never called from CI.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── PHP gates: style (Pint), architecture (Deptrac), back-end tests (Pest) ──
  backend:
    name: Backend (Pint · Deptrac · Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Deptrac (layer boundaries)
        run: vendor/bin/deptrac analyse --no-progress --no-cache

      - name: Deptrac (no unassigned classes)
        run: |
          vendor/bin/deptrac debug:unassigned --no-cache | tee deptrac-unassigned.txt
          grep -q "There are no unassigned tokens." deptrac-unassigned.txt

      - name: Pest (PHP tests)
        run: php artisan test

  # ── Front-end unit gate: Vitest (Vue components) ──
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest (Vue unit tests)
        run: npm run test:unit

  # ── Supply-chain gate: no known high/critical advisory in the npm lockfile ──
  audit:
    name: Audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Reads package-lock.json against the registry's advisory database, so no install
      # is needed. Note this gate can go red on a PR that changed nothing: advisories are
      # published against dependencies we already had. That is the gate working — fix it
      # in its own change rather than lowering the threshold. Only high and critical fail;
      # moderate and below are reported by `npm audit` locally but do not block a merge.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high --package-lock-only

  # ── Browser E2E gate: Playwright drives the real app ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # No MySQL service: Playwright's global setup migrates and seeds a throwaway SQLite
    # file and serves the app on it as APP_ENV=e2e (tests/e2e/env.js overrides these).
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build front-end assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (browser E2E)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
