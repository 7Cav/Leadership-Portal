name: CI

# The quality gate (Story 1.3, NFR9). Every push to and PR against the integration
# branch runs all seven gates — Pint, Deptrac, Pest, Vitest, Playwright, npm audit and
# composer audit. They run as separate jobs, so the overall pipeline status is failure if
# ANY single gate fails (AND-combined, not advisory). External API seams are never called
# from CI.
#
# Third-party actions are pinned to a full commit SHA, with the tag it was taken from in a
# comment: a tag can be moved to different code after we start trusting it, a SHA cannot.
# Bump them by looking up the new tag's commit (`git ls-remote https://github.com/<repo>
# refs/tags/<tag>`, using the `^{}` line for an annotated tag).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # A new advisory can land against code that has not changed. The weekly run (audit job
  # only) tells a maintainer when the world moves, instead of an unrelated PR turning red.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Secret scan: keys, server addresses and other values that must never reach this public repo ──
  # Scans only the new commits (the pull request's, or the ones a push adds) with gitleaks' built-in rules plus
  # .gitleaks.toml. See docs/sensitive-information.md for what counts and what to do when it fires.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then RANGE="-1"; else RANGE="$BASE..HEAD"; fi
          ./gitleaks git --no-banner --redact --verbose --config .gitleaks.toml --log-opts="$RANGE" .

  # ── PHP gates: style (Pint), architecture (Deptrac), back-end tests (Pest) ──
  backend:
    name: Backend (Pint · Deptrac · Pest)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Deptrac (layer boundaries)
        run: vendor/bin/deptrac analyse --no-progress --no-cache

      - name: Deptrac (no unassigned classes)
        run: |
          vendor/bin/deptrac debug:unassigned --no-cache | tee deptrac-unassigned.txt
          grep -q "There are no unassigned tokens." deptrac-unassigned.txt

      - name: Pest (PHP tests)
        run: php artisan test

  # ── The same Pest suite on MySQL 8.4, the production database ──
  # phpunit.xml pins in-memory SQLite, which cannot show MySQL's JSON key reordering, strict
  # string lengths, case-insensitive collation or row locks. The job env below wins over
  # phpunit.xml's <env> (none of them is `force`d) and over the copied .env.
  backend-mysql:
    name: Backend on MySQL (migrate · Pest)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, pdo_mysql, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Every migration from an empty schema, on its own, so a MySQL-only migration failure
      # reads as one rather than as the first test's error.
      - name: Migrate (fresh MySQL schema)
        run: php artisan migrate --force --no-interaction

      - name: Pest (PHP tests on MySQL)
        run: php artisan test

  # ── Front-end unit gate: Vitest (Vue components) ──
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest (Vue unit tests)
        run: npm run test:unit

  # ── Supply-chain gate: no known high/critical advisory in the npm lockfile, none in composer.lock ──
  audit:
    name: Audit (npm · composer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Reads package-lock.json against the registry's advisory database, so no install
      # is needed. Note this gate can go red on a PR that changed nothing: advisories are
      # published against dependencies we already had. That is the gate working — fix it
      # in its own change rather than lowering the threshold. Only high and critical fail;
      # moderate and below are reported by `npm audit` locally but do not block a merge.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high --package-lock-only

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # The same check for the PHP side. It reads composer.lock against Packagist's advisory
      # database, so no install is needed. Unlike npm audit it fails on an advisory of any
      # severity: the PHP tree is small and every advisory so far had a patch release. Abandoned
      # packages are reported but do not block a merge.
      - name: composer audit
        run: composer audit --locked --no-interaction --abandoned=report

  # ── Browser E2E gate: Playwright drives the real app ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # No MySQL service: Playwright's global setup migrates and seeds a throwaway SQLite
    # file and serves the app on it as APP_ENV=e2e (tests/e2e/env.js overrides these).
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, pdo_sqlite, sqlite3, bcmath
          coverage: none
          tools: composer:v2

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build front-end assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (browser E2E)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
